<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>ChunkHP</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#2c3242"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </radialGradient>
    <linearGradient id="hp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a5c"/>
      <stop offset="0.5" stop-color="#e5221b"/>
      <stop offset="1" stop-color="#9e0f0b"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f0a81c"/>
    </linearGradient>
    <linearGradient id="chunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd0c4"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#a87418"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="track">
      <rect x="44" y="176" width="312" height="60" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="64" fill="url(#bg)"/>

  <g transform="translate(0 52)">
  <!-- Health bar frame and empty track -->
  <rect x="34" y="166" width="332" height="80" rx="22" fill="url(#frame)"/>
  <rect x="42" y="174" width="316" height="64" rx="15" fill="#170709"/>

  <g clip-path="url(#track)">
    <!-- Remaining health -->
    <rect x="44" y="176" width="146" height="60" fill="url(#hp)"/>
    <rect x="44" y="179" width="146" height="13" fill="#ffffff" opacity="0.25"/>
    <!-- Ghost trail where the chunk broke away, with a cracked edge -->
    <polygon points="190,176 238,176 226,190 242,204 225,220 236,236 190,236" fill="url(#ghost)"/>
  </g>

  <!-- Motion streaks behind the flying chunk -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.75">
    <line x1="246" y1="160" x2="214" y2="172" stroke-width="7"/>
    <line x1="260" y1="136" x2="232" y2="146" stroke-width="5"/>
  </g>

  <!-- The chunk, knocked out of the bar -->
  <g filter="url(#glow)" transform="translate(34 -78) rotate(16 270 206)">
    <polygon points="238,176 312,176 312,236 236,236 225,220 242,204 226,190"
             fill="url(#chunk)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Small fragments -->
  <g fill="#ffffff">
    <polygon points="352,70 368,64 362,82"/>
    <polygon points="364,150 378,146 370,162"/>
    <polygon points="326,52 336,49 333,61"/>
  </g>

  </g>
</svg>
